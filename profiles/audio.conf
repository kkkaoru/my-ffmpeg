# Reads audio, writes WAV.
--enable-swresample
--enable-filter=aresample
--enable-demuxer=wav,aiff,flac,mp3,ogg,aac,ac3,eac3
# mp3float, mp2 and mp1 are the ones a full FFmpeg picks by default, so WAV bytes stay the same.
--enable-decoder=aac,aac_latm,mp3float,mp2,mp1,opus,vorbis,flac,alac,ac3,eac3,dca,s302m,truehd,mlp,adpcm_ms,adpcm_ima_wav
--enable-decoder=pcm_s8,pcm_u8,pcm_s16le,pcm_s16be,pcm_s24le,pcm_s24be,pcm_s32le,pcm_s32be
--enable-decoder=pcm_f32le,pcm_f32be,pcm_f64le,pcm_f64be,pcm_alaw,pcm_mulaw,pcm_bluray,pcm_dvd,pcm_s24daud
--enable-parser=aac,aac_latm,ac3,mpegaudio,opus,vorbis,flac,dca,mlp
--enable-encoder=pcm_s16le
--enable-muxer=wav

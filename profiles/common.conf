# In every flavor. Later profiles turn the libraries back on; the last flag wins.
--disable-everything
--disable-autodetect
--disable-doc
--disable-debug
--disable-ffplay
--disable-network
--disable-avdevice
--disable-swscale
--disable-swresample
--enable-protocol=file,pipe
# Containers: mov covers mp4 and m4v, matroska covers webm, mpegts covers mts and m2ts.
--enable-demuxer=mov,matroska,avi,mpegts,mxf

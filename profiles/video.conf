# Reads video, writes raw frames.
--enable-swscale
--enable-filter=fps,scale,pad
# AV1 is dav1d alone: the native av1 decoder only works through a hardware decoder.
--enable-libdav1d
--enable-decoder=libdav1d,h264,hevc,vp8,vp9,mpeg1video,mpeg2video,mpeg4,prores,dnxhd,mjpeg,dvvideo,rawvideo
--enable-parser=av1,h264,hevc,vp8,vp9,mpegvideo,mpeg4video,dnxhd,mjpeg
--enable-encoder=rawvideo
--enable-muxer=rawvideo
